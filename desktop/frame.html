<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'">
  <title>研究手札桌面工作台</title>
  <link rel="stylesheet" href="frame.css">
  <script src="frame.js" type="module"></script>
</head>
<body>
  <header>
    <span class="title">研究手札</span>
    <span id="control-error" role="alert" hidden></span>
    <div class="controls">
      <label for="opacity">背景不透明度</label>
      <input id="opacity" type="range" min="60" max="100" step="5" value="85">
      <output for="opacity" id="opacity-value">85%</output>
      <button id="fit" type="button">适应桌面</button>
      <button id="login" type="button">粘贴登录链接</button>
      <button id="browser" type="button">在浏览器打开</button>
      <button id="hide" type="button" aria-label="隐藏到托盘" title="隐藏到托盘">−</button>
      <button id="quit" type="button" aria-label="退出桌面版" title="退出桌面版">×</button>
    </div>
  </header>
  <div id="load-error" hidden>
    <p id="error-message" role="alert"></p>
    <button id="retry" type="button">重新加载</button>
  </div>
  <button class="resize-edge resize-n" data-edge="n" type="button" aria-label="调整窗口上边缘" tabindex="-1"></button>
  <button class="resize-edge resize-s" data-edge="s" type="button" aria-label="调整窗口下边缘" tabindex="-1"></button>
  <button class="resize-edge resize-w" data-edge="w" type="button" aria-label="调整窗口左边缘" tabindex="-1"></button>
  <button class="resize-edge resize-e" data-edge="e" type="button" aria-label="调整窗口右边缘" tabindex="-1"></button>
  <button class="resize-edge resize-nw" data-edge="nw" type="button" aria-label="调整窗口左上角" tabindex="-1"></button>
  <button class="resize-edge resize-ne" data-edge="ne" type="button" aria-label="调整窗口右上角" tabindex="-1"></button>
  <button class="resize-edge resize-sw" data-edge="sw" type="button" aria-label="调整窗口左下角" tabindex="-1"></button>
  <button class="resize-edge resize-se" data-edge="se" type="button" aria-label="调整窗口大小" title="拖动调整大小，方向键微调"></button>
</body>
</html>
